<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Avalon</title>
<style>
:root{--gold:#d4af5a;--ink:#efe6d0;--mut:#a3a1bd;--good:#4aa3d9;--evil:#d0506a;--ok:#4caf7d;--ln:#2d3158;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(ellipse at 50% 0,#2a2f66 0,#14173a 45%,#0a0b1c 100%) fixed;color:var(--ink);font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff8 50%,transparent),radial-gradient(1px 1px at 70% 20%,#fff7 50%,transparent),radial-gradient(1.5px 1.5px at 85% 65%,#fff6 50%,transparent),radial-gradient(1px 1px at 35% 80%,#fff6 50%,transparent),radial-gradient(1px 1px at 55% 50%,#fff5 50%,transparent);animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:1}}
#app{max-width:480px;margin:0 auto;padding:16px;position:relative;z-index:1}
h1{font-size:40px;letter-spacing:.3em;margin:6px 0 0;text-align:center;background:linear-gradient(#f6e3a1,#b8913d);-webkit-background-clip:text;background-clip:text;color:transparent;text-indent:.3em}
h2{color:var(--gold);margin:6px 0 10px;font-size:22px;letter-spacing:.06em}h3{color:var(--gold);margin:16px 0 4px;font-size:16px}
p,li{line-height:1.55;font-size:15px}ul{padding-left:20px;margin:4px 0}.mut{color:var(--mut);font-size:13px}.c{text-align:center}
.card{background:linear-gradient(#1b1f3f,#12142b);border:1px solid #d4af5a66;border-radius:14px;padding:16px;margin:12px 0;box-shadow:inset 0 0 0 3px #12142b,inset 0 0 0 4px #d4af5a30,0 8px 24px #0007}
.b{display:block;width:100%;padding:14px;margin:10px 0;border-radius:10px;border:1px solid #d4af5a88;background:linear-gradient(#1f2350,#151833);color:var(--ink);font-weight:600;font-size:15px;font-family:inherit;letter-spacing:.12em;cursor:pointer;transition:transform .15s,box-shadow .25s,border-color .25s;box-shadow:0 2px 0 #0007}
.b:active{transform:scale(.97)}@media(hover:hover){.b:hover{box-shadow:0 0 16px #d4af5a55;border-color:var(--gold)}}
.b.gold{background:linear-gradient(#ecc977,#b8913d);color:#1a1530;border-color:#f3dc92;text-shadow:0 1px 0 #fff5}
.b.sm{width:48px;display:inline-block;margin:0;padding:8px}.b:disabled{opacity:.35}
.b.sel{outline:3px solid var(--gold);background:linear-gradient(#4a4222,#2c2814)}.b.ok{border-color:var(--ok)}.b.no{border-color:var(--evil)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.row .b{margin:0}
input{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid var(--ln);background:#0c0e22;color:var(--ink);font-size:16px;font-family:inherit}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 10px #d4af5a44}
.track{display:flex;gap:8px;justify-content:center;margin:6px 0}
.m{width:48px;height:48px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-weight:700;background:#0c0e22}
.m.cur{border-color:var(--gold);box-shadow:0 0 12px #d4af5a66}.m.S{background:#1f5e96;border-color:var(--good)}.m.F{background:#8c1f35;border-color:var(--evil)}
.fade .m.S,.fade .m.F{animation:pop .5s both}@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.big{font-size:26px;text-align:center;margin:10px 0}.sub{text-align:center;color:var(--mut);letter-spacing:.35em;margin:2px 0 6px;font-size:13px;text-indent:.35em}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold);justify-content:center;margin:6px 0 18px}.orn::before,.orn::after{content:'';height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--gold))}.orn::after{transform:scaleX(-1)}
.sh{display:block;width:84px;margin:24px auto 0;animation:fl 4s ease-in-out infinite;filter:drop-shadow(0 0 14px #d4af5a66)}@keyframes fl{50%{transform:translateY(-6px)}}
.cas{display:block;width:100%;margin-top:26px;opacity:.8}
.good{color:var(--good)}.evil{color:var(--evil)}.err{color:var(--evil);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--ln);padding:6px;text-align:center}
.ov{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:9}.ov .card{max-width:360px;width:100%}
.fade{animation:f .4s ease}@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pl{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln)}.fade .pl{animation:sl .4s both;animation-delay:calc(var(--i,0)*.07s)}@keyframes sl{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.seal{width:54px;height:54px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:24px;color:#f3dc92;background:radial-gradient(#b3302f,#6d1620);box-shadow:0 0 0 3px #d4af5a55,0 4px 12px #0008}
.gd{--ac:#2a5d9f}.ev{--ac:#9b2335}.art{fill:var(--ac);width:100%;height:100%}.art .g{fill:#d4af5a}
.fc{perspective:1000px;width:230px;height:330px;margin:12px auto;cursor:pointer}.fade .fc{animation:deal .6s cubic-bezier(.2,.8,.2,1) both}@keyframes deal{from{opacity:0;transform:translateY(-40px) rotate(-8deg)}to{opacity:1;transform:none}}
.fi{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}.fc.on .fi{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;overflow:hidden;border:2px solid var(--gold);box-shadow:0 10px 30px #000a}
.back{background:repeating-linear-gradient(45deg,#1a1f4a 0 9px,#121538 9px 18px);display:grid;place-items:center}.back::before{content:'';position:absolute;inset:10px;border:1px solid #d4af5a99;border-radius:8px}.back .sh{width:90px;margin:0;animation:none}
.front{transform:rotateY(180deg);background:radial-gradient(#f6ecd0,#dcc891);color:#2a2133;text-align:center;padding:26px 14px 14px}.front::before{content:'';position:absolute;inset:8px;border:1px solid #8a6a1688;border-radius:8px}
.cn{position:absolute;font-style:normal;font-size:30px;line-height:1;color:var(--ac)}.tl{top:12px;left:16px}.br{bottom:12px;right:16px;transform:rotate(180deg)}
.front .art{width:130px;height:130px;margin:14px auto 6px;display:block}.front b{display:block;font-size:17px;letter-spacing:.04em}.front small{letter-spacing:.2em;color:var(--ac);font-weight:700}
.rv{opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .5s .5s,transform .5s .5s}.fc.on~.rv{opacity:1;pointer-events:auto;transform:none}.fc.on~.hint{visibility:hidden}
.rr{display:flex;gap:12px;align-items:center}.ic{flex:0 0 60px;height:60px;border-radius:50%;background:#efe3c2;padding:9px;border:2px solid var(--gold)}.ic.big{width:96px;height:96px;margin:0 auto 8px;flex:none;animation:gl 2.5s ease-in-out infinite alternate}@keyframes gl{to{box-shadow:0 0 28px #d4af5a99}}
.mc{display:inline-grid;place-items:center;width:52px;height:72px;margin:4px;border-radius:8px;border:2px solid var(--gold);font-size:26px}.mc.s{background:#1f5e96}.mc.f{background:#8c1f35}
.fade .mc{animation:fi .6s both;animation-delay:calc(var(--i)*.35s)}@keyframes fi{from{opacity:0;transform:rotateY(90deg) scale(.8)}to{opacity:1;transform:none}}.fade .vd{animation:f .5s both}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div>
<script>
const $=document.getElementById('app');
const T=[[2,3,2,3,3],[2,3,4,3,4],[2,3,3,4,4],[3,4,4,5,5],[3,4,4,5,5],[3,4,4,5,5]],EV=[2,2,3,3,3,4],K='avalon_v2';
const RN={Merlin:'Merlin',Percival:'Percival',Loyal:'Pelayan Setia Arthur',Assassin:'Assassin',Morgana:'Morgana',Minion:'Antek Mordred'};
const RD={Merlin:'Good. Mengetahui semua pemain Evil. Jika Good menang 3 misi, Merlin harus bersembunyi dari Assassin.',Percival:'Good. Mengetahui Merlin dan Morgana, tetapi tidak tahu mana yang mana.',Loyal:'Good. Tidak punya informasi khusus. Andalkan logika dan diskusi.',Assassin:'Evil. Mengenal sekutu Evil. Jika Good menang 3 misi, menebak Merlin untuk membalikkan hasil.',Morgana:'Evil. Tampak seperti Merlin di mata Percival.',Minion:'Evil. Mengenal sekutu Evil dan menggagalkan misi.'};
const sv=p=>`<svg class="art" viewBox="0 0 100 100">${p}</svg>`;
const ART={
Loyal:sv('<path d="M16 72L10 32L34 52L50 24L66 52L90 32L84 72Z"/><rect x="16" y="76" width="68" height="10" rx="2"/><circle class="g" cx="50" cy="56" r="5"/>'),
Morgana:sv('<path d="M18 72L12 36L32 54L50 26L68 54L88 36L82 72Z"/><rect x="18" y="76" width="64" height="10" rx="2"/><circle class="g" cx="12" cy="32" r="5"/><circle class="g" cx="50" cy="22" r="5"/><circle class="g" cx="88" cy="32" r="5"/>'),
Merlin:sv('<path d="M50 8L76 74H24Z"/><ellipse cx="50" cy="78" rx="38" ry="9"/><path class="g" d="M50 34l4 9h9l-7 6 3 9-9-6-9 6 3-9-7-6h9z"/>'),
Percival:sv('<path d="M24 82V46Q24 16 50 16Q76 16 76 46V82Z"/><path class="g" d="M32 44H68V54H32Z"/><path class="g" d="M47 54H53V82H47Z"/>'),
Assassin:sv('<path d="M50 8L60 58H40Z"/><rect x="28" y="58" width="44" height="8" rx="3"/><rect x="45" y="66" width="10" height="20"/><circle class="g" cx="50" cy="90" r="4"/>'),
Minion:sv('<path d="M28 80V50Q28 26 50 26Q72 26 72 50V80Z"/><path d="M28 48Q10 42 12 14Q30 22 36 40Z"/><path d="M72 48Q90 42 88 14Q70 22 64 40Z"/><path class="g" d="M38 50H62V58H38Z"/>')};
const SH='<svg class="sh" viewBox="0 0 100 120"><path d="M50 4L92 18V58Q92 98 50 116Q8 98 8 58V18Z" fill="#12142b" stroke="#d4af5a" stroke-width="3"/><path d="M50 16L80 26V58Q80 88 50 102Q20 88 20 58V26Z" fill="none" stroke="#d4af5a" stroke-opacity=".5"/><path d="M50 24L54 32V74H62V80H54V90H46V80H38V74H46V32Z" fill="#d4af5a"/><circle cx="50" cy="95" r="3" fill="#d4af5a"/></svg>';
const CAS='<svg class="cas" viewBox="0 0 258 80"><path fill="#0b0d22" stroke="#d4af5a" stroke-opacity=".35" d="M0 80V52h20V40h8v-8l8-10 8 10v8h8v12h24V36h10V20l10-12 10 12v16h10v16h22V44h14V30l8-12 8 12v14h14v8h20V40h8v-8l8-10 8 10v8h8v12h24v28Z"/></svg>';
const isEvil=r=>r==='Assassin'||r==='Morgana'||r==='Minion';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const B=(a,t,c='',x='')=>`<button class="b ${c}" data-a="${a}" ${x}>${t}</button>`;
let S={scr:'menu',pm:true,names:Array(5).fill(''),g:null,err:''};
try{const x=JSON.parse(localStorage.getItem(K));if(x&&x.names){S=x;if(S.g&&S.g.st==='priv'){S.g.st='hand';S.g.flip=false}}}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const need=g=>T[g.n-5][g.m],fails=g=>(g.m===3&&g.n>=7)?2:1;
function deal(names){const n=names.length,ev=EV[n-5];let r=['Merlin','Assassin'];if(S.pm)r.push('Percival','Morgana');
let e=r.filter(isEvil).length,gd=r.length-e;while(e<ev){r.push('Minion');e++}while(gd<n-ev){r.push('Loyal');gd++}
r=shuf(r);S.names=names.slice();S.g={n,players:names.map((x,i)=>({name:x,role:r[i]})),leader:rnd(n),m:0,res:[],rej:0,team:[],ph:'reveal',q:0,st:'hand',votes:[],cards:[],pend:null,flip:false};S.scr='game'}
function fin(w,r){const g=S.g;g.ph='end';g.winner=w;g.reason=r}
function cfm(msg,fn){const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="card"><p>${msg}</p><div class="row"><button class="b">BATAL</button><button class="b gold">YA</button></div></div>`;const bs=d.querySelectorAll('button');bs[0].onclick=()=>d.remove();bs[1].onclick=()=>{d.remove();fn()};document.body.appendChild(d)}
function act(a,i){const g=S.g;switch(a){
case 'go':S.scr=i;S.err='';break;
case 'cont':if(g.st==='priv')g.st='hand';S.scr='game';break;
case 'pause':if(g.st==='priv')g.st='hand';S.scr='menu';break;
case 'pm':S.pm=!S.pm;break;
case 'np':{const n=S.names.length+ +i;if(n>=5&&n<=10){if(+i>0)S.names.push('');else S.names.pop()}break}
case 'start':{const ns=S.names.map(x=>x.trim());if(ns.some(x=>!x)){S.err='Isi semua nama pemain.';break}if(new Set(ns.map(x=>x.toLowerCase())).size<ns.length){S.err='Nama pemain harus berbeda.';break}S.err='';if(S.g&&S.g.ph!=='end'){cfm('Permainan yang belum selesai akan diganti. Lanjutkan?',()=>{deal(ns);render()});break}deal(ns);break}
case 'clear':cfm('Hapus progres permainan tersimpan?',()=>{S.g=null;render()});break;
case 'ack':g.st='priv';g.pend=null;g.flip=false;break;
case 'rdone':g.q++;g.st='hand';g.flip=false;if(g.q>=g.n){g.ph='team';g.q=0}break;
case 'tog':{const k=g.team.indexOf(+i);if(k>=0)g.team.splice(k,1);else if(g.team.length<need(g))g.team.push(+i);break}
case 'subteam':cfm('Kirim tim ini untuk divoting?',()=>{g.ph='vote';g.q=0;g.st='hand';g.votes=[];g.pend=null;render()});break;
case 'pick':g.pend=i;break;
case 'lockv':if(g.pend==null||g.votes.length!==g.q)break;g.votes.push(g.pend==='1');g.pend=null;g.q++;g.st='hand';if(g.q>=g.n)g.ph='voteres';break;
case 'vnext':{if(g.votes.filter(Boolean).length*2>g.n){g.ph='mission';g.q=0;g.st='hand';g.cards=[]}else{g.rej++;g.team=[];if(g.rej>=5)fin('Evil','Lima usulan tim berturut-turut ditolak.');else{g.leader=(g.leader+1)%g.n;g.ph='team'}}break}
case 'lockm':if(g.pend==null||g.cards.length!==g.q)break;g.cards.push(g.pend==='1');g.pend=null;g.q++;g.st='hand';if(g.q>=g.team.length){g.shown=shuf(g.cards);const f=g.cards.filter(x=>!x).length;g.res.push(f>=fails(g)?'F':'S');g.ph='missionres'}break;
case 'mnext':{const s=g.res.filter(x=>x==='S').length,f=g.res.length-s;g.m++;g.rej=0;g.team=[];g.leader=(g.leader+1)%g.n;g.q=0;g.st='hand';if(f>=3)fin('Evil','Tiga misi gagal.');else if(s>=3)g.ph='discuss';else g.ph='team';break}
case 'toassn':g.ph='assassin';g.st='hand';g.pend=null;break;
case 'locka':{const t=g.players[+g.pend],mer=g.players.find(p=>p.role==='Merlin');if(t.role==='Merlin')fin('Evil',`Assassin menebak ${esc(t.name)} dan benar: dia Merlin.`);else fin('Good',`Assassin menebak ${esc(t.name)}, salah. Merlin adalah ${esc(mer.name)}.`);break}
case 'again':deal(g.players.map(p=>p.name));break;
case 'tomenu':S.g=null;S.scr='menu';break}}
const bar=t=>`<div class="row"><button class="b sm" data-a="go" data-i="menu">←</button><h2 style="margin:0">${t}</h2><span style="width:48px"></span></div><div class="orn" style="margin-top:12px">✦</div>`;
function track(g){return`<div class="track">`+[0,1,2,3,4].map(i=>`<div class="m ${g.res[i]||''} ${i===g.m&&g.ph!=='end'?'cur':''}">${g.res[i]?(g.res[i]==='S'?'✔':'✘'):T[g.n-5][i]+(i===3&&g.n>=7?'*':'')}</div>`).join('')+`</div>`}
function hdr(g){return track(g)+`<p class="c mut">Misi ${Math.min(g.m+1,5)} · Penolakan ${g.rej}/5 · Leader: <b style="color:var(--ink)">${esc(g.players[g.leader].name)}</b>${g.n>=7&&g.m===3?'<br>Misi ini butuh 2 kartu Fail':''}</p>`}
const hand=(n,l,sub='Serahkan HP kepada')=>`<div class="card c"><div class="seal">✦</div><p class="mut">${sub}</p><div class="big">${esc(n)}</div><p class="mut">Pemain lain jangan mengintip.</p>${B('ack',l,'gold')}</div>`;
const fcard=(r,on)=>{const ev=isEvil(r),s=ev?'♛':'♔';return`<div class="fc ${on?'on':''} ${ev?'ev':'gd'}" data-a="flip"><div class="fi"><div class="ff back">${SH}</div><div class="ff front"><i class="cn tl">${s}</i><i class="cn br">${s}</i>${ART[r]}<b>${RN[r]}</b><small>${ev?'TIM EVIL':'TIM GOOD'}</small></div></div></div>`};
function info(g,i){const p=g.players,r=p[i].role,nm=f=>p.filter((x,j)=>j!==i&&f(x)).map(x=>esc(x.name));let l=[],t='Anda tidak mendapat informasi khusus.';
if(r==='Merlin'){l=nm(x=>isEvil(x.role));t='Pemain Evil:'}else if(r==='Percival'){l=nm(x=>x.role==='Merlin'||x.role==='Morgana');t='Salah satu dari dua ini Merlin, satunya Morgana:'}else if(isEvil(r)){l=nm(x=>isEvil(x.role));t='Sekutu Evil Anda:'}
return`<p>${t}</p>`+(l.length?`<div class="big">${l.join(' · ')}</div>`:'')}
function game(){const g=S.g,p=g.players;let h='',pv=g.st==='priv';const cur=p[g.q];
if(!pv&&g.ph!=='reveal')h+=hdr(g);
switch(g.ph){
case'reveal':h+=pv?`<p class="c mut">Role rahasia ${esc(cur.name)}</p>${fcard(cur.role,g.flip)}<p class="c mut hint">Ketuk kartu untuk membalik</p><div class="rv c">${info(g,g.q)}${B('rdone','SEMBUNYIKAN INFORMASI & SELESAI','gold')}</div>`:`<h2>Fase Pembukaan</h2><p class="mut">Pemain ${g.q+1} dari ${g.n}. Setiap pemain melihat role secara privat.</p>`+hand(cur.name,'SAYA '+esc(cur.name)+' — LIHAT ROLE');break;
case'team':{const nd=need(g);h+=`<div class="card"><h2>Pilih Tim Misi</h2><p><b>${esc(p[g.leader].name)}</b> (Leader) memilih <b>${nd}</b> anggota. Terpilih: ${g.team.length}/${nd}</p>`+p.map((x,i)=>B('tog',esc(x.name)+(i===g.leader?' ♔':''),g.team.includes(i)?'sel':'',`data-i="${i}"`)).join('')+B('subteam','KIRIM TIM UNTUK VOTING','gold',g.team.length===nd?'':'disabled')+`</div>`;break}
case'vote':h+=pv?`<div class="card c"><h2>Suara ${esc(cur.name)}</h2><p>Tim usulan: <b>${g.team.map(i=>esc(p[i].name)).join(', ')}</b></p>${B('pick','✔ SETUJU',g.pend==='1'?'sel ok':'ok','data-i="1"')}${B('pick','✘ TOLAK',g.pend==='0'?'sel no':'no','data-i="0"')}${B('lockv','KUNCI SUARA & SEMBUNYIKAN','gold',g.pend==null?'disabled':'')}</div>`:`<h2>Voting Tim</h2><p class="mut">Pemilih ${g.q+1} dari ${g.n}. Tim: ${g.team.map(i=>esc(p[i].name)).join(', ')}</p>`+hand(cur.name,'SAYA '+esc(cur.name)+' — VOTING');break;
case'voteres':{const ap=g.votes.filter(Boolean).length,ok=ap*2>g.n;h+=`<div class="card"><h2>Hasil Voting</h2>`+p.map((x,i)=>`<div class="pl" style="--i:${i}"><span>${esc(x.name)}</span><b class="${g.votes[i]?'good':'evil'}">${g.votes[i]?'✔ Setuju':'✘ Tolak'}</b></div>`).join('')+`<p class="big ${ok?'good':'evil'}">${ap} Setuju · ${g.n-ap} Tolak<br>${ok?'TIM DITERIMA':'TIM DITOLAK'}</p>${B('vnext',ok?'MULAI MISI':(g.rej+1>=5?'LANJUT':'LEADER BERIKUTNYA'),'gold')}</div>`;break}
case'mission':{const m=p[g.team[g.q]],ev=isEvil(m.role);h+=pv?`<div class="card c"><h2>Kartu Misi — ${esc(m.name)}</h2><p class="mut">${ev?'Anda Evil: boleh memilih Success atau Fail.':'Anda Good: wajib memilih Success.'}</p>${B('pick','✔ SUCCESS',g.pend==='1'?'sel ok':'ok','data-i="1"')}${B('pick','✘ FAIL',g.pend==='0'?'sel no':'no','data-i="0"'+(ev?'':' disabled'))}${B('lockm','KUNCI KARTU & SEMBUNYIKAN','gold',g.pend==null?'disabled':'')}</div>`:`<h2>Pelaksanaan Misi</h2><p class="mut">Anggota ${g.q+1} dari ${g.team.length}.</p>`+hand(m.name,'SAYA '+esc(m.name)+' — PILIH KARTU');break}
case'missionres':{const f=g.cards.filter(x=>!x).length,r=g.res[g.res.length-1];h+=`<div class="card c"><h2>Hasil Misi</h2><div>${g.shown.map((x,i)=>`<span class="mc ${x?'s':'f'}" style="--i:${i}">${x?'✔':'✘'}</span>`).join('')}</div><div class="vd" style="animation-delay:${g.shown.length*.35+.3}s"><p>Success: ${g.cards.length-f} · Fail: ${f}</p><p class="big ${r==='S'?'good':'evil'}">${r==='S'?'MISI BERHASIL':'MISI GAGAL'}</p><p class="mut">Urutan kartu diacak; pemilih Fail tidak diungkap.</p></div>${B('mnext','LANJUTKAN','gold')}</div>`;break}
case'discuss':h+=`<div class="card c"><h2>Good Menang 3 Misi!</h2><p>Good hampir menang. Evil punya satu kesempatan terakhir: Assassin menebak Merlin. Silakan berdiskusi, lalu Assassin mengambil HP.</p>${B('toassn','LANJUT KE FASE ASSASSIN','gold')}</div>`;break;
case'assassin':{const a=p.find(x=>x.role==='Assassin');h+=pv?`<div class="card c"><h2>Siapa Merlin?</h2><p class="mut">Pilih satu pemain.</p>`+p.map((x,i)=>isEvil(x.role)?'':B('pick',esc(x.name),g.pend===String(i)?'sel':'',`data-i="${i}"`)).join('')+B('locka','KONFIRMASI TEBAKAN','gold',g.pend==null?'disabled':'')+`</div>`:`<h2>Fase Assassin</h2>`+hand(a.name,'SAYA '+esc(a.name)+' — ASSASSIN','Assassin mengungkap diri. Serahkan HP kepada');break}
case'end':h+=`<div class="card c"><div class="ic big ${g.winner==='Good'?'gd':'ev'}">${g.winner==='Good'?ART.Loyal:ART.Assassin}</div><h2>${g.winner==='Good'?'TIM GOOD MENANG':'TIM EVIL MENANG'}</h2><p>${g.reason}</p></div><div class="card"><h3 style="margin-top:0">Role semua pemain</h3>`+p.map((x,i)=>`<div class="pl" style="--i:${i}"><span>${esc(x.name)}</span><b class="${isEvil(x.role)?'evil':'good'}">${RN[x.role]}</b></div>`).join('')+`</div>${B('again','MAIN LAGI','gold')}${B('tomenu','KEMBALI KE MENU')}`}
if(!pv&&g.ph!=='end')h+=`<button class="b sm" style="width:auto;padding:8px 14px;margin-top:14px" data-a="pause">MENU</button>`;
return h}
function menu(){const g=S.g;return`${SH}<h1>AVALON</h1><p class="sub">THE RESISTANCE</p><div class="orn">✦</div>${g&&g.ph!=='end'?B('cont','LANJUTKAN PERMAINAN','gold'):''}${B('go','MULAI PERMAINAN',g&&g.ph!=='end'?'':'gold','data-i="lobby"')}${B('go','CARA BERMAIN','','data-i="howto"')}${B('go','DAFTAR ROLE','','data-i="roles"')}${B('go','PENGATURAN','','data-i="settings"')}${CAS}`}
function lobby(){const n=S.names.length,ev=EV[n-5];return bar('Pemain')+`<div class="card"><div class="row">${B('np','−','sm','data-i="-1"')}<b>${n} pemain</b>${B('np','+','sm','data-i="1"')}</div>`+S.names.map((x,i)=>`<input data-n="${i}" value="${esc(x)}" placeholder="Nama pemain ${i+1}" maxlength="14">`).join('')+`<p class="mut">Good ${n-ev} · Evil ${ev}. Role: Merlin, Assassin${S.pm?', Percival, Morgana':''}, sisanya Pelayan Setia / Antek Mordred.</p>${S.err?`<p class="err">${S.err}</p>`:''}</div>${B('start','BAGIKAN ROLE & MULAI','gold')}`}
function howto(){return bar('Cara Bermain')+`<div class="card"><h3 style="margin-top:0">A. Tujuan</h3><ul><li>Good menyelesaikan 3 dari 5 misi.</li><li>Evil menggagalkan 3 misi.</li><li>Jika Good menang 3 misi, Assassin menebak Merlin. Benar: Evil menang. Salah: Good menang.</li></ul>
<h3>B. Role</h3><ul><li>Setiap pemain mendapat satu role acak dan rahasia.</li><li>Good: Merlin, Percival, Pelayan Setia Arthur.</li><li>Evil: Assassin, Morgana, Antek Mordred.</li><li>Role sesuai jumlah pemain dan pengaturan.</li></ul>
<h3>C. Fase Pembukaan</h3><ul><li>HP memberi instruksi bertahap. Tiap pemain membalik kartu role secara privat lalu menyembunyikannya.</li><li>Evil saling mengenal; Merlin melihat semua Evil; Percival melihat Merlin dan Morgana (tanpa tahu mana yang mana).</li></ul>
<h3>D. Pemilihan Tim</h3><ul><li>Leader dan jumlah anggota tim ditentukan otomatis menurut jumlah pemain dan misi.</li><li>Leader memilih tim; semua memilih Setuju/Tolak secara rahasia.</li><li>Mayoritas Setuju menerima tim. Seri berarti ditolak.</li><li>Jika ditolak, Leader pindah. Lima penolakan berturut-turut pada misi yang sama: Evil langsung menang.</li></ul>
<h3>E. Pelaksanaan Misi</h3><ul><li>Hanya anggota tim memilih kartu Success atau Fail secara rahasia.</li><li>Good wajib Success; Evil boleh Success atau Fail.</li><li>Satu Fail menggagalkan misi. Misi ke-4 dengan 7+ pemain butuh dua Fail.</li><li>Kartu diacak sebelum ditampilkan; pemilih Fail tidak pernah diungkap.</li></ul>
<h3>F. Hasil Misi</h3><ul><li>Indikator misi diperbarui dan Leader berpindah.</li><li>Good 3 misi: fase Assassin. Evil 3 misi gagal atau 5 penolakan: Evil menang.</li></ul>
<h3>G. Etika</h3><ul><li>Jangan menunjukkan role atau mengintip pilihan pemain lain.</li><li>Boleh berdiskusi, berargumen, menggertak, dan mencurigai.</li><li>Ikuti instruksi moderator virtual.</li></ul></div>${B('go','MULAI PERMAINAN','gold','data-i="lobby"')}${B('go','KEMBALI','','data-i="menu"')}`}
function roles(){return bar('Daftar Role')+Object.keys(RN).map(r=>`<div class="card rr ${isEvil(r)?'ev':'gd'}"><div class="ic">${ART[r]}</div><div><b class="${isEvil(r)?'evil':'good'}">${RN[r]}</b><p style="margin:4px 0 0">${RD[r]}</p></div></div>`).join('')+`<div class="card"><h3 style="margin-top:0">Komposisi & anggota tim</h3><table><tr><th>Pemain</th><th>Good/Evil</th><th>Misi 1–5</th></tr>`+T.map((t,i)=>`<tr><td>${i+5}</td><td>${i+5-EV[i]}/${EV[i]}</td><td>${t.join(' ')}${i>=2?' <span class="mut">(M4: 2 Fail)</span>':''}</td></tr>`).join('')+`</table></div>`+B('go','KEMBALI','','data-i="menu"')}
function settings(){return bar('Pengaturan')+`<div class="card"><p><b>Percival & Morgana</b><br><span class="mut">Role tambahan (varian). Matikan untuk aturan dasar tanpa keduanya.</span></p>${B('pm',S.pm?'AKTIF':'NONAKTIF',S.pm?'sel':'')}</div>${B('clear','HAPUS PROGRES TERSIMPAN')}`}
let lastKey='',lastT=0;
function render(){const g=S.g;let h='';switch(S.scr){case'menu':h=menu();break;case'lobby':h=lobby();break;case'howto':h=howto();break;case'roles':h=roles();break;case'settings':h=settings();break;case'game':h=g?game():menu()}
const k=S.scr+(g?g.ph+g.q+g.st+g.m:'');$.innerHTML=`<div class="${k!==lastKey?'fade':''}">${h}</div>`;if(k!==lastKey){lastT=Date.now();window.scrollTo(0,0)}lastKey=k;save()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled||Date.now()-lastT<450)return;
if(b.dataset.a==='flip'){S.g.flip=b.classList.toggle('on');save();return}
act(b.dataset.a,b.dataset.i);render()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.n!==undefined){S.names[+t.dataset.n]=t.value;save()}});
render();
</script></body></html>
